name: magic_diary
description: "Magic Diary – Personal Information & Life Record Management Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Firebase SDKs
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1

  # Utilities & Formatting
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.0

  # Storage & Preferences
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Pickers & Files
  file_picker: ^8.0.0
  image_picker: ^1.1.0

  # PDF Generation & Export
  pdf: ^3.10.8
  printing: ^5.13.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
