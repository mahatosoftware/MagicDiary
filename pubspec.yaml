name: magic_diary
description: "Magic Diary – Personal Information & Life Record Management Platform"
publish_to: 'none'
version: 1.0.10+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Firebase SDKs
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1

  # Utilities & Formatting
  intl: ^0.20.2
  uuid: ^4.4.0
  crypto: ^3.0.3
  google_fonts: ^8.2.1

  # Storage & Preferences
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Pickers & Files
  file_picker: ^8.0.0
  image_picker: ^1.1.0

  # PDF Generation & Export
  pdf: ^3.10.8
  printing: ^5.13.0
  google_sign_in: ^7.2.0
  google_mobile_ads: ^9.2.0
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2
  firebase_app_check: ^0.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.0
  home_widget: ^0.10.0
  archive: ^4.7.1
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
